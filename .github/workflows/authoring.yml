name: Authoring checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ./authoring
      - run: python -m unittest discover -s authoring/tests -v

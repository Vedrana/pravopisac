[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pravopisac-authoring"
version = "0.1.0"
description = "Local, reference-grounded question drafting with separate human review"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
pravopisac-authoring = "pravopisac_authoring.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
